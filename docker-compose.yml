version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: jark-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jark_db}
      MYSQL_USER: ${MYSQL_USER:-jark_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jark_pass}
    ports:
      - "3306:3306"
    volumes:
      - jark-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jark-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - jark-qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  jark-mysql-data:
  jark-qdrant-data:
