spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jark_db?allowPublicKeyRetrieval=true&useSSL=false
    username: jark_user
    password: jark_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-migration-naming: true

logging:
  level:
    root: INFO
    com.example.Jark: DEBUG

jark:
  workspace:
    base-dir: ${JARK_WORKSPACE_DIR:/tmp/jark/workspaces}
  rag:
    top-k: 10
    max-context-tokens: 4000
    min-similarity-score: 0.0
    qdrant:
      enabled: ${JARK_QDRANT_ENABLED:false}
      host: ${JARK_QDRANT_HOST:localhost}
      grpc-port: ${JARK_QDRANT_GRPC_PORT:6334}
      collection: ${JARK_QDRANT_COLLECTION:jark_chunks}
