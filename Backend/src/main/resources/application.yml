spring:
  application:
    name: jark
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Docker Sandbox Configuration (VXC-170)
sandbox:
  image: openjdk:21-slim
  memory:
    limit: 512m
  cpu:
    limit: 1.0
  timeout:
    seconds: 300

# Docker Configuration
docker:
  host: unix:///var/run/docker.sock

jark:
  security:
    jwt:
      # A development-only fallback. Production must set JARK_JWT_SECRET to a unique base64-encoded 256-bit key.
      secret: ${JARK_JWT_SECRET:dm94Y29kZS1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LTMya2V5}
      expiration-seconds: ${JARK_JWT_EXPIRATION_SECONDS:3600}
  mcp:
    # Deliberately opt-in: this exposes the authenticated, read-only MCP endpoint at /mcp.
    enabled: ${JARK_MCP_ENABLED:false}
