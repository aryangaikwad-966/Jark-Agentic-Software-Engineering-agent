spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:tc:mysql:8.0:///test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-migration-naming: true

logging:
  level:
    root: INFO
    com.example.Jark: DEBUG

jark:
  workspace:
    base-dir: ${java.io.tmpdir}/jark_test_workspaces
  rag:
    top-k: 5
    max-context-tokens: 2000
    min-similarity-score: 0.0
    qdrant:
      enabled: false
